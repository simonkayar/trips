<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Destinations · Trips &amp; Tours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧳</text></svg>">
</head>
<body data-page="destinations">
<div id="site-header"></div>

<main class="wrap">
  <div class="page-head">
    <div class="eyebrow">Where we've been</div>
    <h1>Destinations</h1>
    <p class="lead">Every place gets its own mind-map page. Search, or filter by international / domestic and by state.</p>
  </div>

  <div class="toolbar">
    <input type="search" id="q" placeholder="Search a place, state or country…">
    <div class="chips" id="scope-chips">
      <button class="chip active" data-scope="all">All</button>
      <button class="chip terracotta" data-scope="international">International</button>
      <button class="chip" data-scope="domestic">Domestic</button>
    </div>
    <span class="count-note" id="count"></span>
  </div>
  <div class="chips" id="region-chips" style="margin-bottom:24px"></div>

  <div id="groups"></div>
</main>

<div id="site-footer"></div>
<script src="js/loader.js"></script>
<script src="js/app.js"></script>
<script src="js/destinations.js"></script>
</body>
</html>
