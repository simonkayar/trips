<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maps · Trips &amp; Tours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧳</text></svg>">
</head>
<body data-page="maps">
<div id="site-header"></div>

<main class="wrap">
  <div class="page-head">
    <div class="eyebrow">Pins on the map</div>
    <h1>Where we've stood</h1>
    <p class="lead">Two maps: the world for our trips abroad, and India for everything closer to home. Click a pin to open that place.</p>
  </div>

  <div class="section-title"><h2>🌏 International</h2><span class="muted small" id="intl-count"></span></div>
  <div class="map-box" id="world-map"></div>
  <div class="map-list" id="world-list"></div>

  <div class="section-title"><h2>🪷 India</h2><span class="muted small" id="dom-count"></span></div>
  <div class="map-box" id="india-map"></div>
  <div class="map-legend" id="india-legend"></div>
  <div class="map-list" id="india-list"></div>
</main>

<div id="site-footer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="js/loader.js"></script>
<script src="js/app.js"></script>
<script src="js/maps.js"></script>
</body>
</html>
