<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Album · Trips &amp; Tours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧳</text></svg>">
</head>
<body data-page="album">
<div id="site-header"></div>

<main class="wrap">
  <div class="page-head">
    <div class="eyebrow">Our photos</div>
    <h1>Album</h1>
    <p class="lead">Every photo we have uploaded, grouped by destination. Click any picture to view it large.</p>
  </div>
  <div class="toolbar">
    <select id="filter" style="max-width:320px"><option value="">All destinations</option></select>
    <span class="count-note" id="count"></span>
  </div>
  <div id="album"></div>
</main>

<div class="lightbox" id="lightbox">
  <button class="close" aria-label="Close">✕</button>
  <button class="navbtn prev" aria-label="Previous">‹</button>
  <img alt="">
  <div class="cap"></div>
  <button class="navbtn next" aria-label="Next">›</button>
</div>

<div id="site-footer"></div>
<script src="js/loader.js"></script>
<script src="js/app.js"></script>
<script src="js/album.js"></script>
</body>
</html>
