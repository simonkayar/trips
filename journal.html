<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal · Trips &amp; Tours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧳</text></svg>">
</head>
<body data-page="journal">
<div id="site-header"></div>

<main class="wrap">
  <div class="page-head">
    <div class="eyebrow">Memory log</div>
    <h1>Journal</h1>
    <p class="lead">Little things that happened on the trips — the stuff photos don't capture. Anyone in the family can add one. Newest first.</p>
  </div>

  <div class="grid" style="grid-template-columns: 1fr 340px; gap: 30px; align-items: start">
    <div>
      <details class="card pad" id="triplog" style="margin-bottom:26px">
        <summary style="cursor:pointer;font-family:var(--font-display);font-size:1.25rem;font-weight:600">🗓️ Trip log — every trip, by year <span class="muted small" id="triplog-count" style="font-family:var(--font-body);font-weight:500"></span></summary>
        <div id="triplog-body" style="margin-top:14px"></div>
      </details>
      <div class="toolbar">
        <select id="filter" style="max-width:320px"><option value="">All places</option></select>
        <span class="count-note" id="count"></span>
      </div>
      <div class="timeline" id="timeline"></div>
    </div>

    <aside class="card pad" style="position:sticky;top:90px">
      <h3>✍️ Add a memory</h3>
      <p class="muted small" id="form-note">Posts go straight onto the site. Simon gets an email for each one.</p>
      <form id="note-form" autocomplete="off">
        <label class="field">Who are you?</label>
        <select id="n-who" style="margin-bottom:10px"></select>
        <label class="field">Place</label>
        <select id="n-place" style="margin-bottom:10px"></select>
        <label class="field">Date</label>
        <input type="date" id="n-date" style="margin-bottom:10px">
        <label class="field">Title</label>
        <input type="text" id="n-title" maxlength="120" placeholder="e.g. The night we missed the last ferry" style="margin-bottom:10px">
        <label class="field">What happened</label>
        <textarea id="n-text" rows="5" maxlength="2000" placeholder="Tell the story…" style="margin-bottom:10px"></textarea>
        <div id="pass-row">
          <label class="field">Family passphrase</label>
          <input type="password" id="n-pass" placeholder="Ask Simon if you don't know it" style="margin-bottom:12px">
        </div>
        <div class="hp" aria-hidden="true"><label>Website</label><input type="text" id="n-website" tabindex="-1" autocomplete="off"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <button class="btn" id="n-save" type="submit">Post it</button>
          <button class="btn secondary sm hidden" id="n-export" type="button">Copy for Claude</button>
          <span class="muted small hidden" id="forget-pass"><a href="#" id="forget-link">forget passphrase</a></span>
        </div>
      </form>
    </aside>
  </div>
</main>

<div id="site-footer"></div>
<script src="js/loader.js"></script>
<script src="js/app.js"></script>
<script src="js/journal.js"></script>
</body>
</html>
