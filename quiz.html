<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz · Trips &amp; Tours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧳</text></svg>">
</head>
<body data-page="quiz">
<div id="site-header"></div>

<main class="wrap quiz-wrap">
  <div class="page-head" style="text-align:center">
    <div class="eyebrow">Who remembers best?</div>
    <h1>The Trips Quiz</h1>
    <p class="lead" style="margin:0 auto">Random questions about the places we've visited. Questions you've already seen are kept aside until the whole bank has been used.</p>
  </div>

  <section class="card pad quiz-setup" id="setup">
    <label class="field">Which destinations?</label>
    <div class="scope-opts" id="scope-opts">
      <div class="scope-opt active" data-scope="both"><div class="ic">🌍</div><div class="lbl">Both</div><div class="cnt"></div></div>
      <div class="scope-opt" data-scope="domestic"><div class="ic">🇮🇳</div><div class="lbl">Domestic</div><div class="cnt"></div></div>
      <div class="scope-opt" data-scope="international"><div class="ic">✈️</div><div class="lbl">International</div><div class="cnt"></div></div>
    </div>
    <div class="row" style="margin-top:18px">
      <div><label class="field">How many questions</label>
        <select id="num"><option>5</option><option selected>10</option><option>15</option><option>20</option><option>30</option></select></div>
      <div><label class="field">Focus on one place (optional)</label>
        <select id="place"><option value="">Any place</option></select></div>
    </div>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <button class="btn lg" id="start">Start quiz →</button>
      <span class="muted small" id="seen-note"></span>
      <button class="btn sm secondary" id="reset-seen">Forget seen questions</button>
    </div>
  </section>

  <section class="card pad hidden" id="play">
    <div class="q-meta"><span id="q-num"></span><span id="q-score"></span></div>
    <div class="q-progress"><span id="q-bar"></span></div>
    <div class="q-place muted small" id="q-place"></div>
    <div class="q-text" id="q-text"></div>
    <div class="q-opts" id="q-opts"></div>
    <div class="q-why hidden" id="q-why"></div>
    <div class="q-actions">
      <button class="btn sm secondary" id="quit">Quit</button>
      <button class="btn hidden" id="next">Next →</button>
    </div>
  </section>

  <section class="card pad hidden" id="result" style="text-align:center">
    <h2 id="r-title"></h2>
    <div class="score-ring" id="r-ring"><span id="r-score"></span></div>
    <p class="muted" id="r-msg"></p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <button class="btn" id="again">Play again</button>
      <a class="btn secondary" href="destinations.html">Browse destinations</a>
    </div>
    <div class="review-list" id="r-review"></div>
  </section>
</main>

<div id="site-footer"></div>
<script src="js/loader.js"></script>
<script src="js/app.js"></script>
<script src="js/quiz.js"></script>
</body>
</html>
